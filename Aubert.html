<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aubert Genève — Fine mechanical watches since 1874</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700;6..96,800&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F4F2;
    --white:#FFFFFF;
    --ink:#15191C;
    --midnight:#0C1922;
    --slate:#4A555E;
    --rule:#C7CAC5;
    --brass:#A3854E;
    --brass-soft:#C8AE7C;

    --display:"Bodoni Moda", Georgia, serif;
    --sans:"Jost", "Helvetica Neue", Arial, sans-serif;

    --pad:clamp(20px,5vw,72px);
    --maxw:1360px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-weight:450;
    font-size:17.5px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad)}

  /* ---------- region bar ---------- */
  .region{
    background:var(--midnight);
    color:#E8EAEA;
    font-size:13.5px;
    font-weight:500;
    letter-spacing:.02em;
  }
  .region .wrap{
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;padding-block:9px;
  }
  .region p{margin:0;color:#A9B4BB}
  .region-pick{display:flex;align-items:center;gap:14px}
  .region-pick span{border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:2px}
  .region-pick button{
    color:var(--brass-soft);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:border-color .2s ease;
  }
  .region-pick button:hover{border-bottom-color:var(--brass-soft)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:60;
    background:var(--white);
    border-bottom:1px solid var(--rule);
  }
  .bar{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:24px;
    padding-block:18px;
  }
  .mark{
    grid-column:2;
    justify-self:center;
    text-align:center;
    line-height:1;
  }
  .mark .crown{display:block;margin:0 auto 6px;width:34px;height:auto}
  .mark .name{
    font-family:var(--display);
    font-size:clamp(19px,2.4vw,25px);
    letter-spacing:.28em;
    text-indent:.28em;
    font-weight:700;
  }
  .mark .est{
    display:block;margin-top:5px;
    font-size:9.5px;font-weight:600;letter-spacing:.32em;text-indent:.32em;
    color:var(--slate);
  }
  .tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:22px}
  .tools button{display:grid;place-items:center;padding:4px}
  .tools svg{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:2}

  /* ---------- desktop nav ---------- */
  nav.primary{grid-column:1;justify-self:start}
  .navlist{display:flex;gap:34px;list-style:none;margin:0;padding:0}
  .navlist > li > button{
    font-size:14px;
    font-weight:600;
    letter-spacing:.11em;
    text-transform:uppercase;
    padding:8px 0;
    position:relative;
    color:var(--ink);
  }
  .navlist > li > button::after{
    content:"";position:absolute;left:0;right:0;bottom:0;
    height:2px;background:var(--brass);
    transform:scaleX(0);transform-origin:left;
    transition:transform .25s ease;
  }
  .navlist > li[data-open="true"] > button::after{transform:scaleX(1)}

  .panel{
    position:absolute;left:0;right:0;top:100%;
    background:var(--white);
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    box-shadow:0 24px 40px -30px rgba(12,25,34,.45);
    display:none;
  }
  .panel[data-open="true"]{display:block}
  .panel .wrap{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:48px;
    padding-block:44px 52px;
  }
  .panel h3{
    margin:0 0 18px;
    font-family:var(--display);
    font-weight:700;
    font-size:21px;
    letter-spacing:.01em;
  }
  .panel ul{list-style:none;margin:0;padding:0;display:grid;gap:11px}
  .panel a{
    font-size:15.5px;font-weight:500;color:var(--slate);
    border-bottom:1px solid transparent;
    transition:color .2s ease,border-color .2s ease;
  }
  .panel a:hover{color:var(--ink);border-bottom-color:var(--brass)}
  .panel .feature{
    grid-column:4;
    border-left:1px solid var(--rule);
    padding-left:48px;
  }
  .panel .feature img{
    width:100%;height:190px;object-fit:cover;
    background:linear-gradient(150deg,#DDE2E4,#F4F5F5);
  }
  .panel .feature p{margin:16px 0 0;font-size:15.5px;font-weight:500;color:var(--slate)}
  .panel .feature .go{
    display:inline-block;margin-top:12px;font-size:13px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;
    border-bottom:2px solid var(--brass);padding-bottom:3px;color:var(--ink);
  }

  .burger{display:none}
  .burger svg{width:26px;height:16px;stroke:var(--ink);stroke-width:2.2}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    min-height:min(86vh,760px);
    display:flex;align-items:flex-end;
    background:var(--midnight);
    overflow:hidden;
  }
  .hero img{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    opacity:.72;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(6,14,20,.86) 0%,rgba(6,14,20,.25) 55%,rgba(6,14,20,.45) 100%);
  }
  .hero .wrap{position:relative;z-index:2;width:100%;padding-block:clamp(44px,8vh,90px)}
  .hero-copy{max-width:640px;color:#fff;opacity:0;transform:translateY(14px);animation:rise 1.1s .15s cubic-bezier(.2,.7,.3,1) forwards}
  .hero .kicker{
    margin:0 0 14px;font-size:12.5px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
    color:var(--brass-soft);
  }
  .hero h1{
    margin:0;
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(42px,7.4vw,80px);
    line-height:1.02;
    letter-spacing:-.015em;
  }
  .hero p{margin:20px 0 32px;color:#DDE2E4;font-weight:450;max-width:46ch}
  @keyframes rise{to{opacity:1;transform:none}}

  .btn{
    display:inline-block;
    padding:16px 42px;
    border-radius:999px;
    background:var(--brass);
    color:#141414;
    font-size:13.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    transition:background .25s ease,color .25s ease;
  }
  .btn:hover{background:var(--brass-soft)}
  .btn-ghost{
    background:transparent;color:#fff;
    border:1.5px solid rgba(255,255,255,.6);
  }
  .btn-ghost:hover{background:#fff;color:var(--ink)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{background:var(--midnight)}

  /* ---------- collection statement ---------- */
  .statement{
    background:linear-gradient(178deg,#FFFFFF 0%,#EDEFF0 58%,#E2E6E8 100%);
    text-align:center;
    padding-block:clamp(56px,9vw,110px) clamp(48px,7vw,86px);
  }
  .statement figure{margin:0 0 clamp(26px,4vw,44px)}
  .statement figure img{
    margin:0 auto;width:min(720px,92%);
    filter:drop-shadow(0 34px 40px rgba(20,32,40,.22));
  }
  .statement .kicker{
    margin:0;font-size:12.5px;font-weight:700;letter-spacing:.3em;text-indent:.3em;color:var(--slate);
  }
  .statement h2{
    margin:14px auto 28px;
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(38px,6vw,66px);
    line-height:1.02;
    letter-spacing:-.02em;
    max-width:14ch;
  }

  /* ---------- carousel ---------- */
  .rail-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;padding-top:clamp(56px,8vw,96px);
  }
  .rail-head h2{
    margin:0;font-family:var(--display);font-weight:700;
    font-size:clamp(30px,4.2vw,46px);letter-spacing:-.01em;
  }
  .rail-head p{margin:10px 0 0;color:var(--slate);font-weight:450;max-width:52ch}
  .rail-nav{display:flex;gap:10px;flex:0 0 auto}
  .rail-nav button{
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--rule);
    display:grid;place-items:center;
    transition:border-color .2s ease,background .2s ease;
  }
  .rail-nav button:hover{border-color:var(--ink);background:var(--white)}
  .rail-nav button{border-width:1.5px}
  .rail-nav svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2}

  .rail{
    display:flex;gap:22px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    padding:34px var(--pad) 10px;
    margin-inline:calc(var(--pad) * -1);
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .card{
    flex:0 0 clamp(258px,30vw,330px);
    scroll-snap-align:start;
    border-radius:14px;
    overflow:hidden;
    aspect-ratio:5/8;
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:26px 24px 30px;
    color:#fff;
    isolation:isolate;
  }
  .card img{
    position:absolute;inset:0;z-index:-2;
    width:100%;height:100%;object-fit:cover;
  }
  .card::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(to top,rgba(4,10,15,.72) 0%,rgba(4,10,15,.18) 46%,rgba(4,10,15,0) 72%);
  }
  .card .line{
    margin:0;font-size:11.5px;font-weight:700;letter-spacing:.24em;text-indent:.24em;
    color:rgba(255,255,255,.9);
  }
  .card .title{
    margin:7px 0 0;font-family:var(--display);font-weight:700;
    font-size:clamp(26px,3.2vw,33px);line-height:1.06;
  }
  .card.c1{background:linear-gradient(160deg,#1D6FA8,#0B3552)}
  .card.c2{background:linear-gradient(160deg,#2F4A34,#12210F)}
  .card.c3{background:linear-gradient(160deg,#6E5637,#2B1F13)}
  .card.c4{background:linear-gradient(160deg,#4A4F57,#1B1F24)}
  .card.c5{background:linear-gradient(160deg,#7C2F3A,#2A0F14)}

  /* ---------- model
