<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURELIAN — Horology Reimagined</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap');

:root {
    --black:#080808;
    --deep:#0d0d0d;
    --gold:#c7a96b;
    --gold2:#e1c88b;
    --white:#f5f3ee;
    --muted:#929292;
}

* { box-sizing:border-box; margin:0; padding:0; }

html { scroll-behavior:smooth; }

body {
    background:var(--black);
    color:var(--white);
    font-family:Inter,sans-serif;
    overflow-x:hidden;
}

nav {
    position:fixed;
    top:0;
    width:100%;
    height:82px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6%;
    z-index:1000;
    background:linear-gradient(to bottom,rgba(5,5,5,.92),transparent);
    backdrop-filter:blur(6px);
}

.logo {
    font-family:"Cormorant Garamond",serif;
    font-size:28px;
    letter-spacing:7px;
}

.nav-links {
    display:flex;
    gap:36px;
    list-style:none;
}

.nav-links a {
    color:#ddd;
    text-decoration:none;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.3s;
}

.nav-links a:hover { color:var(--gold2); }

.hero {
    min-height:100vh;
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
    background:radial-gradient(circle at 50% 45%,#252019 0%,#0a0a0a 40%,#050505 75%);
}

.hero::before {
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(199,169,107,.16),transparent 65%);
    filter:blur(30px);
    animation:pulse 6s infinite alternate;
}

@keyframes pulse {
    from { transform:scale(.9); opacity:.5; }
    to { transform:scale(1.15); opacity:1; }
}

.hero-content {
    position:relative;
    z-index:2;
    text-align:center;
}

.eyebrow {
    color:var(--gold);
    letter-spacing:6px;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.hero h1 {
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(70px,12vw,180px);
    font-weight:300;
    line-height:.75;
    letter-spacing:-5px;
}

.hero p {
    max-width:520px;
    margin:38px auto;
    color:#aaa;
    font-size:14px;
    line-height:1.8;
}

.cta {
    display:inline-block;
    padding:15px 34px;
    border:1px solid rgba(199,169,107,.7);
    color:white;
    text-decoration:none;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    transition:.4s;
}

.cta:hover {
    background:var(--gold);
    color:#050505;
}

.hero-watch {
    position:absolute;
    width:300px;
    height:420px;
    right:8%;
    bottom:-20px;
    transform:rotate(-14deg);
    opacity:.75;
    animation:floatWatch 5s ease-in-out infinite;
}

@keyframes floatWatch {
    0%,100% { transform:rotate(-14deg) translateY(0); }
    50% { transform:rotate(-10deg) translateY(-20px); }
}

.watch-strap {
    position:absolute;
    left:72px;
    width:156px;
    height:150px;
    background:repeating-linear-gradient(90deg,#171717 0px,#272727 4px,#101010 8px);
    border-radius:30px;
}

.strap-top { top:0; }
.strap-bottom { bottom:0; }

.watch-case {
    position:absolute;
    top:105px;
    left:45px;
    width:210px;
    height:210px;
    border-radius:50%;
    background:linear-gradient(135deg,#e8d39c,#76603a 25%,#e5cf94 45%,#554225 70%,#d8bd7b);
    padding:10px;
    box-shadow:0 30px 80px #000,inset 0 0 20px rgba(255,255,255,.5);
}

.watch-face {
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 25%,#424242,#101010 55%,#050505);
    position:relative;
    box-shadow:inset 0 0 30px #000;
}

.watch-face::after {
    content:"AURELIAN";
    position:absolute;
    top:65px;
    width:100%;
    text-align:center;
    font-family:"Cormorant Garamond";
    font-size:13px;
    letter-spacing:3px;
    color:#d7bd7b;
}

.hand {
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom;
    width:2px;
    background:#eee;
}

.hour {
    height:48px;
    transform:rotate(40deg);
}

.minute {
    height:68px;
    transform:rotate(125deg);
}

.second {
    height:76px;
    width:1px;
    background:#c7a96b;
    transform:rotate(215deg);
    animation:second 60s linear infinite;
}

@keyframes second {
    to { transform:rotate(575deg); }
}

.center {
    position:absolute;
    width:8px;
    height:8px;
    background:#c7a96b;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.section {
    padding:150px 8%;
}

.section-label {
    color:var(--gold);
    letter-spacing:4px;
    font-size:10px;
    text-transform:uppercase;
    margin-bottom:20px;
}

.intro {
    max-width:950px;
}

.intro h2 {
    font-family:"Cormorant Garamond";
    font-weight:300;
    font-size:clamp(45px,7vw,90px);
    line-height:1;
}

.intro p {
    margin-top:35px;
    color:#999;
    max-width:650px;
    line-height:1.9;
    font-size:15px;
}

.story {
    display:grid;
    grid-template-columns:1fr 1fr;
    min-height:700px;
}

.story-image {
    background:linear-gradient(120deg,rgba(0,0,0,.2),rgba(0,0,0,.8)),radial-gradient(circle at 60% 40%,#75613d,#161616 45%,#050505);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.story-image span {
    font-family:"Cormorant Garamond";
    font-size:160px;
    opacity:.07;
    transform:rotate(-90deg);
    letter-spacing:20px;
}

.story-content {
    padding:120px 12%;
    background:#0c0c0c;
}

.story-content h2 {
    font-family:"Cormorant Garamond";
    font-size:70px;
    font-weight:300;
}

.story-content p {
    color:#999;
    line-height:1.9;
    margin-top:30px;
    font-size:14px;
}

.founder {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:100px;
    align-items:center;
}

.portrait {
    height:600px;
    position:relative;
    background:radial-gradient(circle at 50% 35%,#80704e,#27231b 25%,#0a0a0a 65%);
    overflow:hidden;
}

.portrait::after {
    content:"";
    position:absolute;
    bottom:-100px;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    height:650px;
    border-radius:50% 50% 0 0;
    background:linear-gradient(90deg,#090909,#34302a,#090909);
}

.founder h2 {
    font-family:"Cormorant Garamond";
    font-size:75px;
    font-weight:300;
}

.founder .quote {
    margin:30px 0;
    font-family:"Cormorant Garamond";
    font-size:28px;
    color:#d6c59f;
}

.founder p {
    color:#999;
    line-height:1.9;
}

.catalogue {
    background:#0a0a0a;
}

.catalogue-header {
    text-align:center;
    margin-bottom:80px;
}

.catalogue-header h2 {
    font-family:"Cormorant Garamond";
    font-size:90px;
    font-weight:300;
}

.catalogue-header p {
    color:#777;
    margin-top:15px;
}

.products {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

/* MAKES MAISON I CLICKABLE WITHOUT CHANGING ITS LOOK */

.product {
    background:#111;
    padding:25px;
    transition:.5s;
    cursor:pointer;
    text-decoration:none;
    color:inherit;
}

.product:visited {
    color:inherit;
}

.product:hover {
    transform:translateY(-12px);
    background:#151515;
}

.product-watch {
    height:430px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#28231b,#0d0d0d 65%);
    overflow:hidden;
}

.product-watch .case {
    width:220px;
    height:220px;
    border-radius:50%;
    padding:9px;
    background:linear-gradient(135deg,#eee,#777,#eee,#444);
    animation:watchRotate 18s linear infinite;
}

@keyframes watchRotate {
    0% { transform:rotateY(0deg) rotateX(4deg); }
    50% { transform:rotateY(180deg) rotateX(-4deg); }
    100% { transform:rotateY(360deg) rotateX(4deg); }
}

.product-watch .face {
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle at 30% 20%,#343434,#0a0a0a 70%);
    position:relative;
    box-shadow:inset 0 0 25px #000;
}

.product-watch .face::before {
    content:"AURELIAN";
    position:absolute;
    top:70px;
    left:0;
    right:0;
    text-align:center;
    font-family:"Cormorant Garamond";
    letter-spacing:3px;
    color:#c7a96b;
}

.tick {
    position:absolute;
    width:2px;
    height:10px;
    background:#ddd;
    left:50%;
    top:8px;
    transform-origin:1px 102px;
}

.tick:nth-child(2){transform:rotate(30deg);}
.tick:nth-child(3){transform:rotate(60deg);}
.tick:nth-child(4){transform:rotate(90deg);}
.tick:nth-child(5){transform:rotate(120deg);}
.tick:nth-child(6){transform:rotate(150deg);}
.tick:nth-child(7){transform:rotate(180deg);}
.tick:nth-child(8){transform:rotate(210deg);}
.tick:nth-child(9){transform:rotate(240deg);}
.tick:nth-child(10){transform:rotate(270deg);}
.tick:nth-child(11){transform:rotate(300deg);}
.tick:nth-child(12){transform:rotate(330deg);}

.product-info {
    padding:25px 5px 5px;
}

.product-info h3 {
    font-family:"Cormorant Garamond";
    font-size:30px;
    font-weight:400;
}

.product-info span {
    display:block;
    color:#777;
    font-size:11px;
    letter-spacing:2px;
    margin-top:8px;
}

.price {
    color:#c7a96b !important;
    margin-top:20px;
}

.craft {
    text-align:center;
    background:radial-gradient(circle at center,#211d16,#080808 65%);
}

.craft h2 {
    font-family:"Cormorant Garamond";
    font-size:90px;
    font-weight:300;
}

.craft p {
    max-width:650px;
    margin:30px auto;
    color:#999;
    line-height:1.9;
}

.stats {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-top:1px solid #242424;
    border-bottom:1px solid #242424;
}

.stat {
    padding:60px 20px;
    text-align:center;
    border-right:1px solid #242424;
}

.stat strong {
    font-family:"Cormorant Garamond";
    font-size:55px;
    font-weight:300;
}

.stat span {
    display:block;
    color:#777;
    font-size:9px;
    letter-spacing:3px;
    margin-top:8px;
}

footer {
    padding:80px 8%;
    display:flex;
    justify-content:space-between;
    border-top:1px solid #222;
}

footer h3 {
    font-family:"Cormorant Garamond";
    font-size:35px;
    font-weight:300;
    letter-spacing:5px;
}

footer p {
    color:#666;
    font-size:11px;
}

.reveal {
    opacity:0;
    transform:translateY(50px);
    transition:1s ease;
}

.reveal.visible {
    opacity:1;
